<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Jayasri's Calculator</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="calculator">

        <div class="top">

            <div>

                <p>CODEALPHA • TASK 2</p>

                <h1>Calculator</h1>

            </div>

            <button id="themeBtn">
                ☾
            </button>

        </div>


        <!-- DISPLAY -->

        <div class="display-box">

            <div id="history"></div>

            <input
                type="text"
                id="display"
                value="0"
                readonly
            >

        </div>


        <!-- BUTTONS -->

        <div class="buttons">

            <button
                class="special"
                data-action="clear"
            >
                AC
            </button>

            <button
                class="special"
                data-action="delete"
            >
                DEL
            </button>

            <button
                class="operator"
                data-action="percent"
            >
                %
            </button>

            <button
                class="operator"
                data-operator="÷"
            >
                ÷
            </button>


            <button data-number="7">
                7
            </button>

            <button data-number="8">
                8
            </button>

            <button data-number="9">
                9
            </button>

            <button
                class="operator"
                data-operator="×"
            >
                ×
            </button>


            <button data-number="4">
                4
            </button>

            <button data-number="5">
                5
            </button>

            <button data-number="6">
                6
            </button>

            <button
                class="operator"
                data-operator="−"
            >
                −
            </button>


            <button data-number="1">
                1
            </button>

            <button data-number="2">
                2
            </button>

            <button data-number="3">
                3
            </button>

            <button
                class="operator"
                data-operator="+"
            >
                +
            </button>


            <button
                class="zero"
                data-number="0"
            >
                0
            </button>

            <button data-action="decimal">
                .
            </button>

            <button
                class="equals"
                data-action="equals"
            >
                =
            </button>

        </div>


        <p class="keyboard">
            Keyboard supported: 0-9, +, -, *, /, %, Enter, Backspace
        </p>

    </div>


    <script src="script.js"></script>

</body>

</html>
